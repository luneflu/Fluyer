[package]
name = "fluyer"
version = "1.3.0"
description = "🦋🎵 Music Player"
authors = ["alvindimas05"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fluyer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["cef"]
cef = ["tauri/cef"]

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
walkdir = "2.5.0"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-prevent-default = "5"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-decorum = "1.1.1"
tauri-plugin-fluyer = { path = "./tauri-plugin-fluyer" }
regex = "1.12"
image = "0.25.10"
lazy_static = "1.5.0"
dotenvy = "0.15.7"
dotenvy_macro = "0.15.7"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4.41"
rusqlite_migration = "2.6"
tokio = { version = "1.52.3", features = ["process", "sync"] }
state = "0.6.0"
serde_json = "1"
futures = "0.3.31"
symphonia = { version = "0.6.0", features = ["all", "opt-simd"] }
urlencoding = "2.1.3"
wgpu = "29"
rand = "0.10.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
libblur = { version = "0.24", features = ["image"] }
tauri-plugin-fs = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-device-info = "1.0.0"
fast_image_resize = { version = "6.0.0", features = ["image"] }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
base64 = "0.22.1"
discord-rich-presence = "1.1.0"
once_cell = "1.21.4"
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", default-features = false , features = [] }
gtk = "0.18.2"
libloading = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
