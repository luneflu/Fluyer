[package]
name = "tauri-plugin-fluyer"
version = "1.2.0"
authors = [ "alvindimas05" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/node_modules"]
links = "tauri-plugin-fluyer"

[dependencies]
serde = "1"
thiserror = "2"
serde_json = "1.0.149"
specta = "=2.0.0-rc.25"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", features = ["specta"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", features = ["specta", "cef"] }

[build-dependencies]
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", features = ["build"] }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
