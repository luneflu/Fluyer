name: Build & Publish

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: 'Publish as Release'
        type: boolean
        default: false
      build_windows_x86_64:
        description: 'Build windows-x86_64'
        type: boolean
        default: true
      build_windows_arm64:
        description: 'Build windows-arm64'
        type: boolean
        default: true
      build_macos_intel:
        description: 'Build macos-intel'
        type: boolean
        default: true
      build_macos_silicon:
        description: 'Build macos-silicon'
        type: boolean
        default: true
      build_linux:
        description: 'Build linux'
        type: boolean
        default: true
      build_linux_cef:
        description: 'Build linux-cef'
        type: boolean
        default: true
      build_android_armv7:
        description: 'Build android-armv7'
        type: boolean
        default: true
      build_android_aarch64:
        description: 'Build android-aarch64'
        type: boolean
        default: true
      build_android_x86_64:
        description: 'Build android-x86_64'
        type: boolean
        default: true

env:
  RUST_BACKTRACE: 1
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-windows-x86_64:
    needs: prepare
    if: ${{ inputs.build_windows_x86_64 }}
    runs-on: windows-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'build-windows-x86_64'
          prefix-key: 'v2-rust'
      - name: Setup Workflow
        shell: bash
        run: bash infra/windows.sh
      - name: Upload artifact
        if: ${{ !inputs.release_build }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ./src-tauri/target/release/bundle/nsis/Fluyer_*.exe
      - name: Publish release
        if: ${{ inputs.release_build }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./src-tauri/target/release/bundle/nsis/Fluyer_*.exe
            ./src-tauri/target/release/bundle/nsis/Fluyer_*.exe.sig
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows-arm64:
    needs: prepare
    if: ${{ inputs.build_windows_arm64 }}
    runs-on: windows-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'build-windows-arm64'
          prefix-key: 'v2-rust'
      - name: Setup Workflow
        shell: bash
        env:
          arch: arm64
        run: bash infra/windows.sh
      - name: Upload artifact
        if: ${{ !inputs.release_build }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: ./src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/Fluyer_*.exe
      - name: Publish release
        if: ${{ inputs.release_build }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/Fluyer_*.exe
            ./src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/Fluyer_*.exe.sig
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos-intel:
    needs: prepare
    if: ${{ inputs.build_macos_intel }}
    runs-on: macos-26-intel
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'build-macos-intel'
          prefix-key: 'v2-rust'
      - name: Setup Workflow
        shell: bash
        run: bash infra/macos.sh
      - name: Rename macOS App bundle
        run: |
          mv ./src-tauri/target/release/bundle/macos/Fluyer.app.tar.gz ./src-tauri/target/release/bundle/macos/Fluyer_${{ needs.prepare.outputs.version }}_x64.app.tar.gz
          mv ./src-tauri/target/release/bundle/macos/Fluyer.app.tar.gz.sig ./src-tauri/target/release/bundle/macos/Fluyer_${{ needs.prepare.outputs.version }}_x64.app.tar.gz.sig
      - name: Upload artifact
        if: ${{ !inputs.release_build }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: ./src-tauri/target/release/bundle/dmg/Fluyer_*_x64.dmg
      - name: Publish release
        if: ${{ inputs.release_build }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./src-tauri/target/release/bundle/dmg/Fluyer_*_x64.dmg
            ./src-tauri/target/release/bundle/macos/Fluyer_*_x64.app.tar.gz
            ./src-tauri/target/release/bundle/macos/Fluyer_*_x64.app.tar.gz.sig
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos-silicon:
    needs: prepare
    if: ${{ inputs.build_macos_silicon }}
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'build-macos-silicon'
          prefix-key: 'v2-rust'
      - name: Setup Workflow
        shell: bash
        run: bash infra/macos.sh
      - name: Rename macOS App bundle
        run: |
          mv ./src-tauri/target/release/bundle/macos/Fluyer.app.tar.gz ./src-tauri/target/release/bundle/macos/Fluyer_${{ needs.prepare.outputs.version }}_aarch64.app.tar.gz
          mv ./src-tauri/target/release/bundle/macos/Fluyer.app.tar.gz.sig ./src-tauri/target/release/bundle/macos/Fluyer_${{ needs.prepare.outputs.version }}_aarch64.app.tar.gz.sig
      - name: Upload artifact
        if: ${{ !inputs.release_build }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-silicon
          path: ./src-tauri/target/release/bundle/dmg/Fluyer_*_aarch64.dmg
      - name: Publish release
        if: ${{ inputs.release_build }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./src-tauri/target/release/bundle/dmg/Fluyer_*_aarch64.dmg
            ./src-tauri/target/release/bundle/macos/Fluyer_*_aarch64.app.tar.gz
            ./src-tauri/target/release/bundle/macos/Fluyer_*_aarch64.app.tar.gz.sig
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: prepare
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-22.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'build-linux'
          prefix-key: 'v2-rust'
      - name: Setup Workflow
        shell: bash
        run: bash infra/linux.sh
      - name: Upload artifact
        if: ${{ !inputs.release_build }}
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            ./src-tauri/target/release/bundle/deb/Fluyer_*_amd64.deb
            ./src-tauri/target/release/bundle/rpm/Fluyer-*.x86_64.rpm
      - name: Publish release
        if: ${{ inputs.release_build }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./src-tauri/target/release/bundle/deb/Fluyer_*_amd64.deb
            ./src-tauri/target/release/bundle/rpm/Fluyer-*.x86_64.rpm
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-linux-cef:
    needs: prepare
    if: ${{ inputs.build_linux_cef }}
    runs-on: ubuntu-22.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Swap to CEF configs
        run: |
          mv ./src-tauri/tauri.cef.conf.json ./src-tauri/tauri.linux.conf.json
          mv ./src-tauri/Cargo.cef.toml ./src-tauri/Cargo.toml
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'build-linux-cef'
          prefix-key: 'v2-rust'
      - name: Setup Workflow
        shell: bash
        run: bash infra/linux.sh
      - name: Rename CEF deb package
        run: |
          mv ./src-tauri/target/release/bundle/deb/fluyer_*_amd64.deb ./src-tauri/target/release/bundle/deb/Fluyer-cef_${{ needs.prepare.outputs.version }}_amd64.deb || \
          mv ./src-tauri/target/release/bundle/deb/Fluyer_*_amd64.deb ./src-tauri/target/release/bundle/deb/Fluyer-cef_${{ needs.prepare.outputs.version }}_amd64.deb
          mv ./src-tauri/target/release/bundle/rpm/fluyer-*.x86_64.rpm ./src-tauri/target/release/bundle/rpm/Fluyer-cef-${{ needs.prepare.outputs.version }}-1.x86_64.rpm || \
          mv ./src-tauri/target/release/bundle/rpm/Fluyer-*.x86_64.rpm ./src-tauri/target/release/bundle/rpm/Fluyer-cef-${{ needs.prepare.outputs.version }}-1.x86_64.rpm
      - name: Upload artifact
        if: ${{ !inputs.release_build }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-cef
          path: |
            ./src-tauri/target/release/bundle/deb/Fluyer-cef_*_amd64.deb
            ./src-tauri/target/release/bundle/rpm/Fluyer-cef-*.x86_64.rpm
      - name: Publish release
        if: ${{ inputs.release_build }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./src-tauri/target/release/bundle/deb/Fluyer-cef_*_amd64.deb
            ./src-tauri/target/release/bundle/rpm/Fluyer-cef-*.x86_64.rpm
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-android-armv7:
    needs: prepare
    if: ${{ inputs.build_android_armv7 }}
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;28.0.13004108"
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'build-android-armv7'
          prefix-key: 'v2-rust'
      - name: Setup Workflow
        shell: bash
        env:
          ANDROID_ARCH: armv7
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          RUNNER_TEMP: ${{ runner.temp }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: bash infra/android.sh
      - name: Rename Android APK
        run: mv ./src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ./Fluyer_${{ needs.prepare.outputs.version }}_armv7.apk
      - name: Upload artifact
        if: ${{ !inputs.release_build }}
        uses: actions/upload-artifact@v4
        with:
          name: android-armv7
          path: ./Fluyer_*_armv7.apk
      - name: Publish release
        if: ${{ inputs.release_build }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./Fluyer_*_armv7.apk
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-android-aarch64:
    needs: prepare
    if: ${{ inputs.build_android_aarch64 }}
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;28.0.13004108"
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'build-android-aarch64'
          prefix-key: 'v2-rust'
      - name: Setup Workflow
        shell: bash
        env:
          ANDROID_ARCH: aarch64
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          RUNNER_TEMP: ${{ runner.temp }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: bash infra/android.sh
      - name: Rename Android APK
        run: mv ./src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ./Fluyer_${{ needs.prepare.outputs.version }}_aarch64.apk
      - name: Upload artifact
        if: ${{ !inputs.release_build }}
        uses: actions/upload-artifact@v4
        with:
          name: android-aarch64
          path: ./Fluyer_*_aarch64.apk
      - name: Publish release
        if: ${{ inputs.release_build }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./Fluyer_*_aarch64.apk
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-android-x86_64:
    needs: prepare
    if: ${{ inputs.build_android_x86_64 }}
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;28.0.13004108"
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'build-android-x86_64'
          prefix-key: 'v2-rust'
      - name: Setup Workflow
        shell: bash
        env:
          ANDROID_ARCH: x86_64
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          RUNNER_TEMP: ${{ runner.temp }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: bash infra/android.sh
      - name: Rename Android APK
        run: mv ./src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ./Fluyer_${{ needs.prepare.outputs.version }}_x86_64.apk
      - name: Upload artifact
        if: ${{ !inputs.release_build }}
        uses: actions/upload-artifact@v4
        with:
          name: android-x86_64
          path: ./Fluyer_*_x86_64.apk
      - name: Publish release
        if: ${{ inputs.release_build }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./Fluyer_*_x86_64.apk
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-updater:
    needs:
      [
        prepare,
        build-windows-x86_64,
        build-windows-arm64,
        build-macos-intel,
        build-macos-silicon,
        build-linux,
        build-linux-cef,
        build-android-armv7,
        build-android-aarch64,
        build-android-x86_64
      ]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && inputs.release_build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          pnpm i
          pnpm tsx scripts/generate-updater-json.ts
      - name: Publish latest.json
        uses: ncipollo/release-action@v1
        with:
          artifacts: latest.json
          tag: v${{ needs.prepare.outputs.version }}
          name: Fluyer v${{ needs.prepare.outputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
