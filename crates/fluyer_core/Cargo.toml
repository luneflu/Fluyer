[package]
name = "fluyer_core"
version = "0.1.0"
authors = ["alvindimas05"]
edition = "2021"
description = "Core audio engine and library manager for Fluyer"

[lib]
name = "fluyer_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
regex = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lazy_static = "1.5"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
chrono = "0.4"
tokio = { version = "1", features = ["process", "sync", "rt-multi-thread", "macros", "fs", "io-util"] }
futures = "0.3"
symphonia = { version = "0.6", features = ["all", "opt-simd"] }
lofty = "0.25"
urlencoding = "2.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
discord-rich-presence = "1.1"
once_cell = "1.21"
log = "0.4"
env_logger = "0.11"
uniffi = { version = "0.28", features = ["cli"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
# `bindgen` because quickjs-sys ships no aarch64-linux-android bindings; the Android
# build script sets BINDGEN_EXTRA_CLANG_ARGS accordingly.
rquickjs = { version = "0.14", features = ["bindgen"] }

# Desktop credential stores only: Android has no keyring backend here, so it uses the
# encrypted-file fallback in `services/secrets.rs`.
# Headless/no-keyring fallback key. Android has no machine id, so it uses a random
# key file next to the encrypted secrets (`services/secrets.rs`).
[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.6"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"


[build-dependencies]
cbindgen = "0.28"
