[package]
name = "fluyer_core"
version = "0.1.0"
authors = ["alvindimas05"]
edition = "2021"
description = "Core audio engine and library manager for Fluyer"

[lib]
name = "fluyer_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
regex = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lazy_static = "1.5"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
chrono = "0.4"
tokio = { version = "1", features = ["process", "sync", "rt-multi-thread", "macros", "fs", "io-util"] }
futures = "0.3"
symphonia = { version = "0.6", features = ["all", "opt-simd"] }
urlencoding = "2.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
discord-rich-presence = "1.1"
once_cell = "1.21"
souvlaki = { version = "0.8", default-features = false }
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[build-dependencies]
cbindgen = "0.28"
